# =============================================================================
# Prompts Configuration - Luciole RAG Assistant
# Version: 5.6 (généraliste) - pipeline query2 v3.6 : analyse typée
# (type_objet, acte, aspects, motifs), un jeu de gabarits par type d'objet,
# cadrage et synthèse indépendants de la forme de la demande
# =============================================================================
# Un principe par prompt, pas de liste de cas. Aucun exemple tiré d'un
# dossier : les objets nommés viennent de la demande ou de la structure
# standard d'une étude d'impact.
# Dans tout gabarit formaté par le code ({query}, {objet}, {motif}...), une
# accolade littérale doit être doublée : {{ }}. Sinon la requête échoue avec
# un message explicite (voulu : plus de dégradation silencieuse).
# =============================================================================

system_prompt: |
  Tu es Luciole, un assistant documentaire pour les études d'impact.
  Tu réponds avec les éléments que les extraits fournis contiennent,
  sans rien inventer et sans commenter la demande.

rag_prompt: |
  CONTEXTE :
  {context}

  QUESTION :
  {query}

  Réponds uniquement à partir des extraits. Donne les éléments concrets
  qu'ils contiennent.
  Cite chaque élément par le titre court du document et la page.
  Cite uniquement la page indiquée dans l'étiquette [Source: ...] de
  l'extrait utilisé ; un numéro de page lu dans le texte d'un extrait
  (sommaire, liste des cartes, renvoi) n'est pas une citation valable.

# -----------------------------------------------------------------------------
# Étape 1a (query2 v3.3) : analyse de la demande, sortie JSON courte.
# Le LLM n'écrit pas de question : il fournit des champs courts, le code
# compose les questions avec les gabarits ci-dessous.
# Les demandes couvertes sont toutes celles qu'une autorité adresse à un
# porteur de projet : compléter ou actualiser une étude, justifier un choix,
# évaluer les effets d'un élément du projet, préciser ou garantir une mesure,
# reprendre un document sur la forme, intégrer d'autres projets, etc.
# -----------------------------------------------------------------------------
analyse_system_prompt: |
  Tu analyses des demandes adressées au porteur d'un projet soumis à étude
  d'impact (remarques d'une autorité environnementale, instructions, questions).
  Tu réponds uniquement par un objet JSON valide, sans commentaire ni balise
  markdown.

analyse_prompt: |
  Demande :
  """
  {query}
  """

  Identifie, avec les mots de la demande :
  - "objet" : la partie du dossier sur laquelle porte concrètement la demande
    (une étude, une analyse, un inventaire, une justification, une mesure,
    un élément du projet, un document, une carte...). Un syntagme nominal
    court, sans verbe. Quand la demande porte sur plusieurs parties, retenir
    celle que la demande vise en premier ; les autres deviennent des aspects.
    L'objet est une chose du dossier ou du projet, jamais l'action que la
    demande réclame : « évaluer les impacts de X » ou « justifier X » ont
    pour objet X, et l'action va dans "acte".
  - "type_objet" : la nature de cet objet, décidée par ce qu'il est et non
    par le mot qui le nomme, une valeur parmi :
    "comparaison" dès que l'objet consiste à comparer ou à choisir entre
    plusieurs options (variantes, scénarios, sites, implantations, gabarits,
    hypothèses), même s'il est nommé « étude de … », « analyse de … » ou
    « justification de … » ; "etude" pour une étude du milieu ou des effets
    du projet qui ne compare pas d'options (un inventaire, un état initial,
    une évaluation d'impacts, un suivi, une méthode) ; "mesure" (une mesure
    d'évitement, de réduction, de compensation, d'accompagnement ou de suivi,
    un engagement, une modalité de travaux ou d'exploitation) ; "element"
    (un élément du projet lui-même : un ouvrage, un raccordement, un accès,
    des terres, des matériaux, un équipement) ; "forme" (la présentation du
    dossier : cartes, figures, photomontages, résumé non technique,
    pagination, structure des documents).
  - "acte" : ce que la demande attend du porteur de projet à propos de
    l'objet, en un groupe verbal court repris de la demande (par exemple
    compléter, actualiser, justifier, évaluer, préciser, garantir, intégrer,
    décrire, démontrer, reprendre...), avec son complément essentiel.
  - "aspects" : les points précis que la demande pose sur l'objet (ce qu'il
    faut déterminer, vérifier, préciser, prendre en compte ou produire à son
    sujet, y compris les autres parties du dossier qu'elle cite), un par
    élément de liste, avec les mots de la demande ; liste vide si la demande
    n'en pose pas. Un aspect est une question de fait que la demande pose
    explicitement (déterminer si…, préciser…, vérifier que…) ; un complément
    qui qualifie l'objet (« présentant … », « permettant … », « prenant en
    compte … ») fait partie de l'objet ou de "demontrer", pas des aspects.
    Un aspect n'est pas un thème environnemental : les thèmes vont dans
    "motifs".
  - "motifs" : les thèmes environnementaux invoqués pour justifier la demande
    (milieux, espèces, paysage, patrimoine, bruit, eau, sols...), un par
    élément de liste, chacun réduit au nom du thème tel qu'écrit dans la
    demande (sans les mots « impacts », « effets » ou « incidences »).
    Conserver les regroupements de la demande : des thèmes que la demande
    coordonne (« X et Y ») forment un seul motif « X et Y » ; seuls les thèmes
    que la demande sépare (virgule, point-virgule) forment des motifs
    distincts. Un terme générique (« environnement », « milieux ») n'est pas
    un motif. Liste vide si la demande n'en invoque aucun.
  - "items" : pour l'objet, puis pour chaque motif et chaque aspect, les
    données concrètes qu'une étude d'impact donne à ce sujet et qu'un chargé
    d'étude irait lire dans un tableau ou une phrase du dossier. Chaque item
    est une donnée, jamais une rubrique ni un document : il commence par une
    tête de grandeur, « nom de chaque … », « nombre de … », « longueur /
    largeur / profondeur / surface / volume de … », « distance entre … et … »,
    « tension / puissance de … », « niveau de … par … », « statut de … »,
    « période de … », « intitulé de chaque … ». Cinq à huit par entrée, en
    vocabulaire d'étude d'impact, sans valeur ni nom tiré d'un dossier
    particulier. Exemple de forme, pour un objet quelconque « chemin
    d'accès » : ["longueur de chemin à créer", "largeur des chemins",
    "surface d'emprise", "nature du revêtement", "nom des voies empruntées",
    "nombre de haies ou de fossés traversés"]. Clé "objet" pour l'objet,
    puis une clé par motif et par aspect reprenant exactement son libellé.
  - "demontrer" : ce que le dossier doit établir pour que la demande soit
    satisfaite (ce qu'il contient déjà et ce qu'il conclut), en une phrase ;
    ce n'est pas une reformulation de la demande.

  Ne pas inventer de sous-thèmes, d'aspects ni d'objets absents de la
  demande. Une demande déjà formulée en question directe donne son sujet
  comme "objet", des listes vides et "acte" : "répondre à la question".

  Format exact :
  {{"objet": "...", "type_objet": "...", "acte": "...", "aspects": ["...", "..."], "motifs": ["...", "..."], "items": {{"objet": ["...", "..."], "<motif>": ["...", "..."]}}, "demontrer": "..."}}

# -----------------------------------------------------------------------------
# Items attendus par thème (code, pas LLM). Pour chaque question, le code
# cherche dans le libellé de l'objet, du motif ou de l'aspect l'un des
# `themes` (sous-chaîne, sans accents) et ajoute les `items` à la question
# (« — en précisant : … »), avant ceux du champ `items` de l'analyse.
# Vocabulaire d'étude d'impact : ce que ces chapitres contiennent dans tout
# dossier, jamais une valeur ni un nom tiré d'un dossier particulier.
# Une entrée = ce qu'un chargé d'étude irait lire dans le chapitre.
# -----------------------------------------------------------------------------
items_par_theme:
  - themes: [paysage, patrimoine, covisibilit, saturation visuelle, photomontage, perception visuelle, unité paysagère]
    items:
      - nom de chaque village, hameau et bourg concerné
      - nom de chaque monument historique, site classé ou inscrit et élément de patrimoine concerné
      - distance de chacun à l'éolienne la plus proche
      - niveau d'impact ou de sensibilité retenu pour chacun
      - numéro et point de vue des photomontages correspondants
      - angle d'occupation de l'horizon et indice de saturation visuelle
      - intitulé des mesures paysagères
  - themes: [biodiversit, milieu naturel, milieux naturels, faune, espèces protégées, especes protegees, continuités écologiques, trame verte]
    items:
      - nom de chaque groupe et espèce patrimoniale ou protégée recensé
      - niveau d'enjeu retenu par groupe et par secteur
      - distance des éoliennes aux boisements, haies et zones humides
      - niveau d'impact brut et résiduel par groupe et par type d'effet
      - intitulé de chaque mesure d'évitement, de réduction, de compensation et de suivi
  - themes: [chiropt, chauve, chauves-souris]
    items:
      - nom de chaque espèce contactée
      - niveau d'activité et d'enjeu par espèce et par période
      - nombre et localisation des points d'écoute et des gîtes identifiés
      - distance des éoliennes aux haies et boisements
      - niveau d'impact brut et résiduel par espèce et par type d'effet
      - paramètres du bridage (période, vitesse de vent, température, heures)
      - intitulé de chaque mesure d'évitement, de réduction et de suivi
  - themes: [oiseau, avifaune, migrat, nidif, hivernant, rapace, busard, ornitho]
    items:
      - nom de chaque espèce patrimoniale et statut de protection
      - effectifs observés par période et localisation des couloirs de migration
      - niveau d'enjeu par espèce et par période
      - niveau d'impact brut et résiduel par espèce et par type d'effet
      - distance des éoliennes aux zones de nidification et de chasse
      - intitulé de chaque mesure d'évitement, de réduction et de suivi
  - themes: [flore, habitat, zone humide, zones humides, végétation, botani]
    items:
      - nom de chaque habitat et espèce végétale patrimoniale recensé
      - surface de chaque habitat concerné par les emprises
      - statut et niveau d'enjeu de chacun
      - surface de zone humide identifiée et méthode de délimitation
      - niveau d'impact brut et résiduel par habitat
      - intitulé de chaque mesure d'évitement, de réduction et de compensation
  - themes: [raccordement, câble, cable, poste source, poste de livraison, réseau électrique, ligne électrique, ligne aérienne, lignes aériennes]
    items:
      - tension, type et section des câbles
      - profondeur et largeur des tranchées et engin de tranchage utilisé
      - volume de terres excavées et destination des déblais
      - longueur du raccordement interne et tracé suivi
      - nom et distance de chaque poste source envisagé
      - capacité d'accueil disponible sur chaque poste source
      - localisation et dimensions des postes de livraison
      - modalité du raccordement externe et gestionnaire de réseau
      - surface d'emprise des travaux et habitats ou espaces à enjeu traversés
  - themes: [parcs voisins, parc voisin, parcs éoliens voisins, effets cumulés, effet cumulé, cumul, contexte éolien, parcs existants, autres parcs, autres projets]
    items:
      - nom de chaque parc ou projet éolien recensé
      - statut de chacun (en exploitation, accordé, en instruction) et date de référence
      - nombre d'éoliennes de chacun
      - distance de chacun au projet et commune d'implantation
      - rayon d'inventaire retenu
      - angle d'occupation de l'horizon et indice de saturation visuelle par village
      - niveau d'impact retenu par thème avec les parcs voisins
      - numéro de la carte d'inventaire des parcs et des photomontages correspondants
  - themes: [bruit, acousti, sonore, émergence, émergences]
    items:
      - nom et localisation de chaque point de mesure et habitation de contrôle
      - niveau de bruit résiduel mesuré par point et par période
      - niveau d'émergence calculé par point, par vitesse de vent et par période
      - valeur des seuils réglementaires appliqués
      - intitulé et paramètres du plan de bridage acoustique
      - modalité de la campagne de mesures de réception
  - themes: [eau, hydrau, hydrolog, captage, nappe, cours d'eau, ruissellement]
    items:
      - nom de chaque cours d'eau, captage et périmètre de protection concerné
      - distance des éoliennes à chacun
      - profondeur de la nappe et sensibilité retenue
      - surface imperméabilisée et volumes de ruissellement
      - intitulé de chaque mesure de protection en phase travaux et exploitation
  - themes: [sol, sols, terres excavées, terre excavée, déblai, déblais, remblai, excavation, fondation, fondations]
    items:
      - volume de terres excavées par ouvrage et au total
      - dimensions et profondeur des fondations
      - destination des terres (réutilisation, régalage, évacuation) et volumes correspondants
      - surface des emprises temporaires et permanentes
      - intitulé de chaque mesure de gestion des sols
  - themes: [natura 2000, zsc, zps, site natura]
    items:
      - nom et code de chaque site Natura 2000 étudié
      - distance de chacun au projet
      - nom des espèces et habitats d'intérêt communautaire ayant justifié la désignation
      - niveau d'incidence retenu par site et par espèce
      - conclusion sur l'absence ou non d'incidence significative
  - themes: [accès, acces, chemin, chemins, piste, pistes, plateforme, plateformes, voirie, convoi, desserte]
    items:
      - longueur de chemins à créer et à renforcer
      - largeur des chemins et surface des plateformes
      - nom des voies empruntées par les convois
      - surface d'emprise temporaire et permanente
      - nombre de haies, fossés ou milieux traversés
      - intitulé de chaque mesure de remise en état
  - themes: [variante, variantes, scénario, scénarios, implantation, gabarit, gabarits, hauteur des éoliennes]
    items:
      - nombre et nom de chaque variante ou scénario étudié
      - nombre, hauteur et position des éoliennes de chacun
      - critères de comparaison et note ou niveau obtenu par variante
      - motif d'abandon de chaque variante écartée
      - distance aux habitations et aux enjeux pour la variante retenue
      - numéro des cartes ou photomontages comparatifs
  - themes: [démantèlement, demantelement, remise en état, garanties financières]
    items:
      - montant des garanties financières
      - profondeur d'excavation des fondations au démantèlement
      - destination des matériaux et taux de recyclage
      - intitulé de chaque opération de remise en état

# Libellés des types d'objet, disponibles dans cadrage_prompt et
# synthese_prompt sous {type_objet_libelle}.
types_objet:
  comparaison: un choix entre plusieurs options
  etude: une étude, une analyse ou un inventaire
  mesure: une mesure ou un engagement du porteur de projet
  element: un élément du projet
  forme: la présentation du dossier

# -----------------------------------------------------------------------------
# Étape 1b : gabarits de composition des questions (code, pas LLM).
# Le code pose, selon type_objet, le gabarit `objet_<type>` puis, s'il existe,
# `objet_<type>_2` (question de détail visant les pages que la première ne
# fait pas remonter) ; à défaut de gabarit pour le type, `objet_element`.
# Puis une question par aspect (`aspect`) et une par motif (`motif`).
# {objet}, {aspect} et {motif} sont remplacés par les champs de l'analyse ;
# {items} reçoit « — en précisant : a, b, c » (les sortes de données
# concrètes attendues, champ `items` de l'analyse) ou rien.
# Les questions nomment des rubriques standard d'une étude d'impact, jamais
# des contenus.
# -----------------------------------------------------------------------------
gabarits_questions:
  # comparaison : options, critères, option retenue ; puis options écartées.
  objet_comparaison: >-
    Que présente le dossier concernant « {objet} » : les éléments étudiés, les
    critères de comparaison ou de choix retenus, et la justification de
    l'option finalement retenue{items} ?
  objet_comparaison_2: >-
    Concernant « {objet} », quelles options ont été étudiées, lesquelles ont
    été écartées et pour quels motifs, et quelles caractéristiques distinguent
    l'option retenue des options écartées{items} ?
  # etude : méthode, résultats, conclusions.
  objet_etude: >-
    Que présente le dossier concernant « {objet} » : méthode et protocole
    (périodes, points ou aires d'étude, sources de données, référentiels),
    résultats obtenus et conclusions ou niveaux d'enjeu retenus{items} ?
  # mesure : contenu, modalités, engagements, suivi.
  objet_mesure: >-
    Que présente le dossier concernant « {objet} » : contenu de la mesure,
    modalités et calendrier de mise en œuvre, engagements du porteur de projet,
    modalités de suivi et de contrôle de son efficacité{items} ?
  # element : description, localisation, impacts, mesures.
  objet_element: >-
    Que présente le dossier concernant « {objet} » : description, modalités de
    réalisation, localisation, impacts identifiés et mesures prévues{items} ?
  # forme : documents et emplacements.
  objet_forme: >-
    Que contient le dossier concernant « {objet} » : quels documents, sections,
    cartes ou figures y correspondent, et que présentent-ils{items} ?
  # Point précis posé par la demande sur l'objet (un par aspect).
  aspect: >-
    Concernant « {objet} », que dit le dossier sur le point suivant : {aspect}{items} ?
  # Thème environnemental invoqué (un par motif).
  motif: >-
    Quels sont les impacts du projet concernant « {motif} » : état initial,
    impacts bruts, mesures d'évitement et de réduction appliquées, et niveau
    d'impact résiduel retenu{items} ?

# -----------------------------------------------------------------------------
# Étape 2 : cadrage transmis à chaque génération, concaténé sous le
# system_prompt (avant l'éventuel prompt personnalisé de l'UI).
# Champs disponibles : {query}, {objet}, {type_objet}, {type_objet_libelle},
# {acte}, {aspects}, {motifs}, {items}, {demontrer}.
# -----------------------------------------------------------------------------
cadrage_prompt: |
  Cette question sert à répondre à la demande suivante, adressée au porteur du
  projet :
  """
  {query}
  """
  La demande porte sur {type_objet_libelle} (« {objet} ») et attend du porteur
  de projet de : {acte}.
  Montre ce que le dossier contient déjà à ce sujet, avec les éléments concrets
  (noms, valeurs, niveaux, pages). Une réponse complète doit permettre d'établir :
  {demontrer}

  Règle de citation : ne cite que le document et la page indiqués dans
  l'étiquette [Source: ...] de l'extrait utilisé. Ne reprends jamais un numéro
  de page lu dans le texte d'un extrait (sommaire, liste des cartes, renvoi).
  Si un extrait est un sommaire ou une liste de figures, ne l'utilise pas
  comme source d'information.

# -----------------------------------------------------------------------------
# Étape 3 : synthèse rédigée à partir des blocs par question (query2 v3.3).
# Champs disponibles : {query}, {objet}, {type_objet}, {type_objet_libelle},
# {acte}, {aspects}, {motifs}, {demontrer}, {blocs}.
# La synthèse ne voit que les blocs (pas les extraits) : elle ne peut citer
# que les étiquettes que les blocs contiennent.
# -----------------------------------------------------------------------------
synthese_system_prompt: |
  Tu rédiges, pour le porteur d'un projet soumis à étude d'impact, la réponse
  à une demande qui lui est adressée (remarque d'une autorité, instruction,
  question). Tu t'appuies uniquement sur les éléments documentés fournis, qui
  sont des réponses extraites du dossier avec leurs citations. Tu n'ajoutes
  aucune information qui n'y figure pas et tu ne cites que les étiquettes
  [Source: ...] présentes dans ces éléments, recopiées telles quelles.

synthese_prompt: |
  Demande adressée au porteur du projet :
  """
  {query}
  """
  Objet de la demande : {objet} ({type_objet_libelle})
  Ce que la demande attend du porteur de projet : {acte}
  Points précis posés sur l'objet : {aspects}
  Motifs invoqués : {motifs}
  Ce qu'une réponse complète doit établir : {demontrer}

  Éléments documentés (une section par question posée au dossier) :
  {blocs}

  Rédige la réponse du porteur de projet à cette demande.

  Structure :
  1. Ce que le dossier établit déjà au sujet de l'objet, selon sa nature :
     pour un choix entre options, les options étudiées, les critères et
     l'option retenue avec sa justification ; pour une étude, la méthode,
     les résultats et les conclusions ; pour une mesure, son contenu, ses
     modalités, les engagements pris et leur suivi ; pour un élément du
     projet, sa description, ses impacts et les mesures prévues ; pour la
     présentation du dossier, les documents, cartes ou figures existants
     et leur emplacement.
  2. Pour chaque point précis posé sur l'objet, ce que le dossier en dit ;
     puis, pour chaque motif invoqué, les impacts identifiés, les mesures
     d'évitement et de réduction appliquées et le niveau d'impact résiduel
     retenu. Omets une partie sans objet (aucun point, ou aucun motif).
  3. Conclusion : au vu des éléments ci-dessus, le dossier contient-il
     déjà ce que la demande attend (« {acte} ») ? Si oui, écris que le
     dossier y répond déjà et qu'aucun complément n'est nécessaire ; sinon,
     dis précisément ce qui manque. La conclusion ne peut affirmer que ce
     que les parties précédentes établissent.

  Forme :
  - Texte continu en paragraphes sous des titres courts qui reflètent le
    contenu (pas les questions posées au dossier).
  - Intègre les valeurs chiffrées dans les phrases : « Le raccordement
    interne, long de 2 830 m, utilise des câbles 20 kV en aluminium ou
    cuivre enfouis à 80 cm minimum » — pas de liste à puces sauf pour
    énumérer des mesures ERC.
  - Chaque fait concret (nom, valeur, distance, niveau) n'apparaît
    qu'une seule fois, dans la partie où il répond le mieux à la demande.
  - Supprime toute phrase qui n'apporte aucun élément concret : une phrase
    disant seulement qu'un état initial a été réalisé, que des sensibilités
    ont été identifiées, ou que le dossier contient une description
    détaillée n'est pas un élément.
  - Pas de phrase d'introduction, de transition ni de rappel de la demande.
  - Chaque affirmation factuelle porte sa citation [Source: ...] recopiée
    d'un élément documenté.
  - Si un élément attendu n'apparaît dans aucune section, écris qu'il n'a
    pas été trouvé dans les éléments fournis.


# -----------------------------------------------------------------------------
# Repli de l'étape 1 (utilisé seulement si l'analyse ci-dessus échoue) :
# questions rédigées par le LLM, ancien chemin v3.
# -----------------------------------------------------------------------------
questions_system_prompt: |
  Tu es chargé d'étude environnement. Tu réponds uniquement en JSON
  valide, sans commentaire ni balise markdown.

questions_prompt: |
  Demande :
  {query}

  Un chargé d'étude doit chercher dans le dossier d'étude d'impact de quoi
  répondre à cette demande. Rédige les questions qu'il poserait au
  dossier : {max_questions} au maximum, une par thème, chacune nommant ce
  qu'il faut trouver (un inventaire, des effets, des mesures, des cartes…)
  et, entre parenthèses, les éléments concrets attendus dans la réponse
  (noms, lieux, valeurs, distances, statuts, numéros de carte…). Une
  question ne demande jamais ce que le dossier ne peut pas contenir (une
  actualisation, un complément, l'avis de l'autorité) et n'emploie aucun
  mot d'un autre thème. Une demande déjà formulée en question directe est
  renvoyée telle quelle.

  Exemple :
  Demande : L'autorité recommande de justifier le respect des émergences sonores réglementaires en période nocturne.
  {{"questions": ["Quels sont les niveaux sonores mesurés et calculés autour du projet (points de mesure, habitations, niveaux résiduels, émergences par vitesse de vent, dépassements, plan de bridage) ?"]}}

  JSON :

no_results_prompt: |
  Je n'ai pas trouvé de document correspondant à votre recherche.

  **Suggestions :**
  - Vérifiez l'orthographe
